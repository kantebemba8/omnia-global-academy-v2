WEBVTT

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omnia Global Academy — Hors connexion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background-color: #002050;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      color: #fff;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 28px;
      border-radius: 16px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.65);
      max-width: 340px;
      margin-bottom: 32px;
    }
    button {
      background-color: #BF8813;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <img src="/IMG_0349.png" alt="Omnia Global Academy" class="logo" onerror="this.style.display='none'" />
  <div class="icon">📡</div>
  <h1>Vous êtes hors connexion</h1>
  <p>
    Certains contenus sont disponibles en mode éco-data.
    Reconnectez-vous à Internet pour continuer votre formation.
  </p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
